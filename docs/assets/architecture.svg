<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Thermalis system architecture</title>
  <desc id="desc">Thermal observations and geospatial context flow through a PostGIS evidence layer into transparent intelligence, a dashboard, and controlled alerts.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #d9e2ec; stroke-width: 2; }
      .source { fill: #eef6ff; stroke: #9cc7ee; stroke-width: 2; }
      .core { fill: #102a43; stroke: #0b1f33; stroke-width: 2; }
      .intel { fill: #e8f8f1; stroke: #8ed5b4; stroke-width: 2; }
      .ops { fill: #fff7e6; stroke: #edc778; stroke-width: 2; }
      .title { font: 700 27px Arial, sans-serif; fill: #102a43; }
      .section { font: 700 16px Arial, sans-serif; fill: #102a43; }
      .label { font: 700 15px Arial, sans-serif; fill: #102a43; }
      .small { font: 14px Arial, sans-serif; fill: #486581; }
      .white { font: 700 16px Arial, sans-serif; fill: #ffffff; }
      .white-small { font: 13px Arial, sans-serif; fill: #d9e2ec; }
      .arrow { stroke: #486581; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .dashed { stroke-dasharray: 7 6; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#486581" />
    </marker>
  </defs>
  <rect class="bg" width="1200" height="620" rx="20" />
  <text class="title" x="44" y="52">Thermalis | Evidence-to-response architecture</text>
  <text class="small" x="44" y="78">A thermal anomaly becomes an explainable operational signal only after spatial, temporal, and sensor context is considered.</text>

  <rect class="panel" x="35" y="108" width="250" height="420" rx="16" />
  <text class="section" x="60" y="142">01  Evidence sources</text>
  <rect class="source" x="60" y="170" width="200" height="62" rx="10" />
  <text class="label" x="78" y="196">NASA FIRMS</text>
  <text class="small" x="78" y="217">thermal observations</text>
  <rect class="source" x="60" y="248" width="200" height="62" rx="10" />
  <text class="label" x="78" y="274">OSM / Overpass</text>
  <text class="small" x="78" y="295">industrial facilities</text>
  <rect class="source" x="60" y="326" width="200" height="62" rx="10" />
  <text class="label" x="78" y="352">WorldCover + Sentinel</text>
  <text class="small" x="78" y="373">land-cover and metadata</text>
  <rect class="source" x="60" y="404" width="200" height="92" rx="10" />
  <text class="label" x="78" y="431">Reference datasets</text>
  <text class="small" x="78" y="453">GIHS industrial heat</text>
  <text class="small" x="78" y="473">crop-burning references</text>

  <path class="arrow" d="M285 318 H330" />
  <rect class="core" x="330" y="200" width="250" height="236" rx="16" />
  <text class="white" x="355" y="237">02  PostGIS evidence layer</text>
  <text class="white-small" x="355" y="270">validate + deduplicate</text>
  <text class="white-small" x="355" y="298">spatial joins + proximity</text>
  <text class="white-small" x="355" y="326">persistence + recurrence</text>
  <text class="white-small" x="355" y="354">feature engineering</text>
  <text class="white-small" x="355" y="394">PostgreSQL / PostGIS</text>

  <path class="arrow" d="M580 318 H625" />
  <rect class="intel" x="625" y="142" width="250" height="352" rx="16" />
  <text class="section" x="650" y="176">03  Intelligence layer</text>
  <rect class="panel" x="650" y="200" width="200" height="86" rx="10" />
  <text class="label" x="668" y="229">TCEF-v1</text>
  <text class="small" x="668" y="251">score, coverage, priority</text>
  <text class="small" x="668" y="270">and signal explanations</text>
  <rect class="panel" x="650" y="304" width="200" height="86" rx="10" />
  <text class="label" x="668" y="333">Model A</text>
  <text class="small" x="668" y="355">restricted reference</text>
  <text class="small" x="668" y="374">classification result</text>
  <rect class="panel" x="650" y="408" width="200" height="62" rx="10" />
  <text class="label" x="668" y="434">Alert triage</text>
  <text class="small" x="668" y="455">review recommendation</text>

  <path class="arrow" d="M875 318 H920" />
  <rect class="ops" x="920" y="108" width="245" height="420" rx="16" />
  <text class="section" x="945" y="142">04  Operations</text>
  <rect class="panel" x="945" y="170" width="195" height="78" rx="10" />
  <text class="label" x="963" y="199">GIS dashboard</text>
  <text class="small" x="963" y="221">MapLibre + GeoJSON</text>
  <text class="small" x="963" y="239">event inspector</text>
  <rect class="panel" x="945" y="268" width="195" height="78" rx="10" />
  <text class="label" x="963" y="297">Alert lifecycle</text>
  <text class="small" x="963" y="319">active / acknowledged</text>
  <text class="small" x="963" y="337">/ resolved</text>
  <rect class="panel" x="945" y="366" width="195" height="98" rx="10" />
  <text class="label" x="963" y="395">Controlled dispatch</text>
  <text class="small" x="963" y="417">verified recipients only</text>
  <text class="small" x="963" y="439">email / SMS / voice / webhook</text>
  <text class="small" x="963" y="456">disabled by default</text>

  <path class="arrow dashed" d="M750 494 V565 H350 V494" />
  <text class="small" x="462" y="588">operator review and feedback loop</text>
</svg>
