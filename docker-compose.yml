services:
  db:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sih_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sih_password}
      POSTGRES_DB: ${POSTGRES_DB:-geospatial_fires_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sih_user} -d ${POSTGRES_DB:-geospatial_fires_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-sih_user}:${POSTGRES_PASSWORD:-sih_password}@db:5432/${POSTGRES_DB:-geospatial_fires_db}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DEBUG=${DEBUG:-false}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-local_development_secret}
      - FIRMS_API_KEY=${FIRMS_API_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8080}
      - ALERT_EMAIL_ENABLED=${ALERT_EMAIL_ENABLED:-false}
      - ALERT_EMAIL_TO=${ALERT_EMAIL_TO:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:8080}
      - EMERGENCY_DISPATCH_ENABLED=${EMERGENCY_DISPATCH_ENABLED:-false}
      - EMERGENCY_ADMIN_KEY=${EMERGENCY_ADMIN_KEY:-}
      - EMERGENCY_MIN_SEVERITY=${EMERGENCY_MIN_SEVERITY:-HIGH}
      - EMERGENCY_DEFAULT_RADIUS_METERS=${EMERGENCY_DEFAULT_RADIUS_METERS:-5000}
      - EMERGENCY_MAX_RECIPIENTS=${EMERGENCY_MAX_RECIPIENTS:-20}
      - EMERGENCY_REQUEST_TIMEOUT_SECONDS=${EMERGENCY_REQUEST_TIMEOUT_SECONDS:-10}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - TWILIO_FROM_PHONE=${TWILIO_FROM_PHONE:-}
      - TWILIO_API_BASE=${TWILIO_API_BASE:-https://api.twilio.com/2010-04-01}
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_MAPTILER_API_KEY: ${VITE_MAPTILER_API_KEY}
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8001/api/v1}
        VITE_LIVE_REFRESH_ENABLED: ${VITE_LIVE_REFRESH_ENABLED:-false}
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

volumes:
  postgres_data:
